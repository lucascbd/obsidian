name: Build and push images

on:
  push:
    branches: [main, feature/agent-improvements]

env:
  REGISTRY: ghcr.io
  OWNER: lucascbd

jobs:
  build-agent:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push agent
        uses: docker/build-push-action@v5
        with:
          context: ./agent
          push: true
          tags: ghcr.io/${{ env.OWNER }}/obsidian-agent:latest

  build-watcher:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push watcher
        uses: docker/build-push-action@v5
        with:
          context: ./watcher
          push: true
          tags: ghcr.io/${{ env.OWNER }}/obsidian-watcher:latest
