# Infra que continua em container no LXC dedicado: ignis (Obsidian web) + ChromaDB.
# O agent e o watcher rodam BARE (systemd) — ver deploy/install.sh.
# Suba com:  docker compose -f deploy/docker-compose.infra.yml up -d
services:

  ignis:
    image: nobbe/ignis:latest
    container_name: obsidian-ignis
    restart: unless-stopped
    ports:
      - "${IGNIS_HOST_PORT:-8080}:8080"
    environment:
      OBSIDIAN_VERSION: ${OBSIDIAN_VERSION:-1.12.7}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
    volumes:
      - /data/compose/113/vaults:/vaults
      - obsidian-app:/app/obsidian-app

  chromadb:
    image: chromadb/chroma:0.5.20
    container_name: obsidian-chromadb
    restart: unless-stopped
    # Publica SÓ no localhost do host — o agent/watcher bare acessam 127.0.0.1:8000.
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
    volumes:
      - /data/compose/113/chroma:/chroma/chroma

volumes:
  obsidian-app:
