services:

  # Obsidian servido via web, lendo o vault direto do disco (./vaults).
  ignis:
    image: nobbe/ignis:latest
    container_name: obsidian-ignis
    restart: unless-stopped
    ports:
      - "${IGNIS_HOST_PORT:-8080}:8080"
    environment:
      OBSIDIAN_VERSION: ${OBSIDIAN_VERSION:-1.12.7}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
    volumes:
      - ./vaults:/vaults
      - obsidian-app:/app/obsidian-app
    networks:
      - obsidian-net

  chromadb:
    image: chromadb/chroma:latest
    container_name: obsidian-chromadb
    restart: unless-stopped
    # Sem porta no host: acessado só internamente via "chromadb:8000" (evita conflito
    # na :8000). Para depurar de fora, descomente e escolha uma porta livre:
    # ports:
    #   - "8001:8000"
    volumes:
      - chromadb_data:/chroma/chroma
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v2/heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - obsidian-net

  # Observa o vault em disco (inotify) e indexa no ChromaDB. Estado em SQLite (./data).
  watcher:
    build:
      context: .
      dockerfile: watcher/Dockerfile
    image: obsidian-watcher
    pull_policy: build
    container_name: obsidian-watcher
    restart: unless-stopped
    environment:
      VAULT_ROOT: /vaults
      DATA_DIR: /data
      CHROMADB_HOST: chromadb
      CHROMADB_PORT: 8000
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-intfloat/multilingual-e5-large}
    volumes:
      - ./vaults:/vaults
      - ./data:/data
    depends_on:
      chromadb:
        condition: service_healthy
    networks:
      - obsidian-net

  agent:
    build:
      context: .
      dockerfile: agent/Dockerfile
    image: obsidian-agent
    pull_policy: build
    container_name: obsidian-agent
    restart: unless-stopped
    ports:
      - "${AGENT_HOST_PORT:-8090}:8090"
    environment:
      VAULT_ROOT: /vaults
      DATA_DIR: /data
      DEFAULT_VAULT: ${DEFAULT_VAULT:-}
      CHROMADB_HOST: chromadb
      CHROMADB_PORT: 8000
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-intfloat/multilingual-e5-large}
      AGENT_PORT: 8090
      # Fase 1 ainda usa OpenRouter como LLM (Fase 2 migra para o Claude Agent SDK).
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL}
      # Fase 2 (Claude Agent SDK):
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY}
    volumes:
      - ./vaults:/vaults
      - ./data:/data
    depends_on:
      chromadb:
        condition: service_healthy
    networks:
      - obsidian-net

volumes:
  chromadb_data:
  obsidian-app:

networks:
  obsidian-net:
    driver: bridge
