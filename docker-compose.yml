services:

  couchdb:
    image: couchdb:3.3
    container_name: obsidian-couchdb
    restart: unless-stopped
    environment:
      COUCHDB_USER: ${COUCHDB_USER}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD}
    ports:
      - "5984:5984"
    volumes:
      - couchdb_data:/opt/couchdb/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5984/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - obsidian-net

  couchdb-init:
    image: curlimages/curl:latest
    container_name: obsidian-couchdb-init
    restart: "no"
    depends_on:
      couchdb:
        condition: service_healthy
    networks:
      - obsidian-net
    environment:
      COUCHDB_USER: ${COUCHDB_USER}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD}
      COUCHDB_DB: ${COUCHDB_DB}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        BASE="http://couchdb:5984"
        AUTH="--user $${COUCHDB_USER}:$${COUCHDB_PASSWORD}"
        curl -sf -X PUT $$AUTH "$$BASE/_node/_local/_config/chttpd_auth/require_valid_user" -d '"false"'
        curl -sf -X PUT $$AUTH "$$BASE/_node/_local/_config/httpd/WWW-Authenticate" -d '"Basic realm=\"administrator\""'
        curl -sf -X PUT $$AUTH "$$BASE/_node/_local/_config/httpd/enable_cors" -d '"true"'
        curl -sf -X PUT $$AUTH "$$BASE/_node/_local/_config/chttpd/max_http_request_size" -d '"4294967296"'
        curl -sf -X PUT $$AUTH "$$BASE/_node/_local/_config/couchdb/max_document_size" -d '"50000000"'
        curl -sf -X PUT $$AUTH "$$BASE/_node/_local/_config/cors/enable" -d '"true"'
        curl -sf -X PUT $$AUTH "$$BASE/_node/_local/_config/cors/credentials" -d '"true"'
        curl -sf -X PUT $$AUTH "$$BASE/_node/_local/_config/cors/origins" -d '"app://obsidian.md,capacitor://localhost,http://localhost"'
        curl -sf -X PUT $$AUTH "$$BASE/_node/_local/_config/cors/methods" -d '"GET, PUT, POST, HEAD, DELETE"'
        curl -sf -X PUT $$AUTH "$$BASE/_node/_local/_config/cors/headers" -d '"accept, authorization, content-type, origin, referer"'
        curl -sf -X PUT $$AUTH "$$BASE/$${COUCHDB_DB}" || true
        echo "CouchDB configurado com sucesso."
        exit 0

  chromadb:
    image: chromadb/chroma:latest
    container_name: obsidian-chromadb
    restart: unless-stopped
    ports:
      - "8008:8000"
    volumes:
      - chromadb_data:/data
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
    healthcheck:
      disable: true
    networks:
      - obsidian-net

  watcher:
    image: ghcr.io/lucascbd/obsidian-watcher:latest
    container_name: obsidian-watcher
    restart: unless-stopped
    environment:
      COUCHDB_URL: http://couchdb:5984
      COUCHDB_USER: ${COUCHDB_USER}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD}
      COUCHDB_DB: ${COUCHDB_DB}
      CHROMADB_HOST: chromadb
      CHROMADB_PORT: 8000
    depends_on:
      couchdb:
        condition: service_healthy
      chromadb:
        condition: service_started
    networks:
      - obsidian-net

  agent:
    image: ghcr.io/lucascbd/obsidian-agent:latest
    container_name: obsidian-agent
    restart: unless-stopped
    ports:
      - "8088:8080"
    environment:
      COUCHDB_URL: http://couchdb:5984
      COUCHDB_USER: ${COUCHDB_USER}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD}
      COUCHDB_DB: ${COUCHDB_DB}
      CHROMADB_HOST: chromadb
      CHROMADB_PORT: 8000
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL}
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY}
    depends_on:
      couchdb:
        condition: service_healthy
      chromadb:
        condition: service_started
    networks:
      - obsidian-net

volumes:
  couchdb_data:
  chromadb_data:

networks:
  obsidian-net:
    driver: bridge
