services:

  couchdb:
    image: couchdb:3.3
    container_name: obsidian-couchdb
    restart: unless-stopped
    environment:
      COUCHDB_USER: ${COUCHDB_USER}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD}
    ports:
      - "5984:5984"
    volumes:
      - couchdb_data:/opt/couchdb/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5984/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - obsidian-net

  couchdb-init:
    image: curlimages/curl:latest
    container_name: obsidian-couchdb-init
    restart: "no"
    depends_on:
      couchdb:
        condition: service_healthy
    networks:
      - obsidian-net
    environment:
      COUCHDB_USER: ${COUCHDB_USER}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD}
      COUCHDB_DB: ${COUCHDB_DB}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        B="http://couchdb:5984/_node/_local/_config"
        curl -sf -u "$COUCHDB_USER:$COUCHDB_PASSWORD" -X PUT -H "Content-Type: application/json" "$$B/chttpd/require_valid_user" -d '"true"' && echo "OK chttpd/require_valid_user" || echo "FAIL chttpd/require_valid_user"
        curl -sf -u "$COUCHDB_USER:$COUCHDB_PASSWORD" -X PUT -H "Content-Type: application/json" "$$B/chttpd_auth/require_valid_user" -d '"true"' && echo "OK chttpd_auth/require_valid_user" || echo "FAIL chttpd_auth/require_valid_user"
        curl -sf -u "$COUCHDB_USER:$COUCHDB_PASSWORD" -X PUT -H "Content-Type: application/json" "$$B/httpd/WWW-Authenticate" -d '"Basic realm=\"administrator\""' && echo "OK WWW-Auth" || echo "FAIL WWW-Auth"
        curl -sf -u "$COUCHDB_USER:$COUCHDB_PASSWORD" -X PUT -H "Content-Type: application/json" "$$B/httpd/enable_cors" -d '"true"' && echo "OK enable_cors" || echo "FAIL enable_cors"
        curl -sf -u "$COUCHDB_USER:$COUCHDB_PASSWORD" -X PUT -H "Content-Type: application/json" "$$B/chttpd/max_http_request_size" -d '"4294967296"' && echo "OK max_http" || echo "FAIL max_http"
        curl -sf -u "$COUCHDB_USER:$COUCHDB_PASSWORD" -X PUT -H "Content-Type: application/json" "$$B/couchdb/max_document_size" -d '"50000000"' && echo "OK max_doc" || echo "FAIL max_doc"
        curl -sf -u "$COUCHDB_USER:$COUCHDB_PASSWORD" -X PUT -H "Content-Type: application/json" "$$B/cors/enable" -d '"true"' && echo "OK cors/enable" || echo "FAIL cors/enable"
        curl -sf -u "$COUCHDB_USER:$COUCHDB_PASSWORD" -X PUT -H "Content-Type: application/json" "$$B/cors/credentials" -d '"true"' && echo "OK cors/credentials" || echo "FAIL cors/credentials"
        curl -sf -u "$COUCHDB_USER:$COUCHDB_PASSWORD" -X PUT -H "Content-Type: application/json" "$$B/cors/origins" -d '"app://obsidian.md,capacitor://localhost,http://localhost"' && echo "OK cors/origins" || echo "FAIL cors/origins"
        curl -sf -u "$COUCHDB_USER:$COUCHDB_PASSWORD" -X PUT -H "Content-Type: application/json" "$$B/cors/methods" -d '"GET, PUT, POST, HEAD, DELETE"' && echo "OK cors/methods" || echo "FAIL cors/methods"
        curl -sf -u "$COUCHDB_USER:$COUCHDB_PASSWORD" -X PUT -H "Content-Type: application/json" "$$B/cors/headers" -d '"accept, authorization, content-type, origin, referer"' && echo "OK cors/headers" || echo "FAIL cors/headers"
        curl -sf -u "$COUCHDB_USER:$COUCHDB_PASSWORD" -X PUT "http://couchdb:5984/_users" && echo "DB _users criado" || echo "DB _users ja existe"
        curl -sf -u "$COUCHDB_USER:$COUCHDB_PASSWORD" -X PUT "http://couchdb:5984/_replicator" && echo "DB _replicator criado" || echo "DB _replicator ja existe"
        curl -sf -u "$COUCHDB_USER:$COUCHDB_PASSWORD" -X PUT "http://couchdb:5984/$COUCHDB_DB" && echo "DB criado" || echo "DB ja existe"
        echo "CouchDB configurado com sucesso."

  chromadb:
    image: chromadb/chroma:latest
    container_name: obsidian-chromadb
    restart: unless-stopped
    ports:
      - "8008:8000"
    volumes:
      - chromadb_data:/data
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
    healthcheck:
      disable: true
    networks:
      - obsidian-net

  watcher:
    image: ghcr.io/lucascbd/obsidian-watcher:latest
    container_name: obsidian-watcher
    restart: unless-stopped
    environment:
      COUCHDB_URL: http://couchdb:5984
      COUCHDB_USER: ${COUCHDB_USER}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD}
      COUCHDB_DB: ${COUCHDB_DB}
      CHROMADB_HOST: chromadb
      CHROMADB_PORT: 8000
    depends_on:
      couchdb:
        condition: service_healthy
      chromadb:
        condition: service_started
    networks:
      - obsidian-net

  agent:
    image: ghcr.io/lucascbd/obsidian-agent:latest
    container_name: obsidian-agent
    restart: unless-stopped
    ports:
      - "8088:8080"
    environment:
      COUCHDB_URL: http://couchdb:5984
      COUCHDB_USER: ${COUCHDB_USER}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD}
      COUCHDB_DB: ${COUCHDB_DB}
      CHROMADB_HOST: chromadb
      CHROMADB_PORT: 8000
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL}
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY}
    depends_on:
      couchdb:
        condition: service_healthy
      chromadb:
        condition: service_started
    networks:
      - obsidian-net

volumes:
  couchdb_data:
  chromadb_data:

networks:
  obsidian-net:
    driver: bridge
